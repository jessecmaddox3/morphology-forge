name: Report a problem
description: Help improve the game with a reproducible, anonymous example.
body:
  - type: markdown
    attributes:
      value: Please leave out learner names, email addresses and real backups. Use a made-up example. Security issues belong in the private route in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to repeat it
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system and game version
